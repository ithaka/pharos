<g>
  <defs>
    <clipPath id="sphere-clip">
      <circle cx="12" cy="13" r="7.78" />
    </clipPath>

    <linearGradient id="sphere-base" x1="15%" y1="15%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#08080c" />
      <stop offset="55%" stop-color="#10101a" />
      <stop offset="100%" stop-color="#07141c" />
    </linearGradient>

    <radialGradient id="sphere-red" cx="75%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#ff263f" />
      <stop offset="38%" stop-color="#e5092b" />
      <stop offset="100%" stop-color="#e5092b" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="sphere-teal" cx="74%" cy="100%" r="62%">
      <stop offset="0%" stop-color="#087f82" stop-opacity=".9" />
      <stop offset="100%" stop-color="#087f82" stop-opacity="0" />
    </radialGradient>
  </defs>

  <g clip-path="url(#sphere-clip)">
    <circle cx="12" cy="13" r="7.78" fill="url(#sphere-base)" />
    <circle cx="12" cy="13" r="7.78" fill="url(#sphere-red)" />
    <circle cx="12" cy="13" r="7.78" fill="url(#sphere-teal)" />
  </g>
</g>
