name: Chromatic

on:
  push:
    paths:
      - 'packages/pharos/**'
      - '.storybook/**'
      - 'yarn.lock'
      - 'package.json'
      - '.github/workflows/chromatic.yml'
    branches-ignore:
      - main
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to run Chromatic on'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    name: Chromatic
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repo (Push)
        if: github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout Repo (Manual Dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: refs/pull/${{ github.event.inputs.pr_number }}/head

      - name: Resolve PR head (Manual Dispatch)
        if: github.event_name == 'workflow_dispatch'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "branch=$(gh pr view "$PR_NUMBER" --json headRefName -q .headRefName)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "YARN_CACHE_DIR=.yarn/cache" >> $GITHUB_OUTPUT

      - uses: actions/cache@v5
        id: yarn-cache # use this to check for `cache-hit` (`steps.yarn-cache.outputs.cache-hit != 'true'`)
        with:
          path: |
            ${{ steps.yarn-cache-dir-path.outputs.YARN_CACHE_DIR }}
            **/node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install Dependencies
        run: yarn --check-cache --immutable

      - name: Setup Storybook
        run: yarn storybook:setup

      - name: Build Storybook
        run: yarn storybook:wc:build --stats-json

      - name: Verify TurboSnap stats file
        run: |
          if [ ! -f .storybook-static/wc/preview-stats.json ]; then
            echo "::error::.storybook-static/wc/preview-stats.json is missing; TurboSnap needs it to trace changed stories"
            exit 1
          fi

      - name: Publish to Chromatic
        uses: chromaui/action@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBuildDir: .storybook-static/wc
          exitZeroOnChanges: true
          exitOnceUploaded: true
          onlyChanged: true
          chromaticSha: ${{ steps.pr.outputs.sha }}
          branchName: ${{ steps.pr.outputs.branch }}
          externals: |
            packages/pharos/src/**/*.scss
            packages/pharos/tokens/**
            packages/pharos/assets/**
            packages/pharos/scripts/**
            packages/pharos/style-dictionary.config.js
