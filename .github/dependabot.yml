version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      non-major:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      non-major-security:
        applies-to: 'security-updates'
        patterns:
          - '*'
    ignore:
      # ithaka/pharos#856
      - dependency-name: 'react'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'react-dom'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@types/react'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@types/react-dom'
        update-types:
          - 'version-update:semver-major'
      # Playwright 1.64.x patched Firefox breaks focus moving between iframes, failing our focus tests
      # https://github.com/microsoft/playwright/issues/43506
      - dependency-name: 'playwright'
        versions: ['1.64.0', '1.64.1']
